do_train: true # Set to true if you want to train the model
do_eval: true # Set to true if you want to evaluate the model
do_predict: true # Set to true if you want to predict with the model
output_dir: './results' # Path to checkpoints
num_train_epochs: 2000 # Number of epochs to train the model
per_device_train_batch_size: 64 # Batch size for training
per_device_eval_batch_size: 64 # Batch size for evaluation
weight_decay: 0.01 # Weight decay for the optimizer
logging_dir: './logs' # Path to logging directory
logging_strategy: 'epoch' # Logging strategy | Need to be Epoch for my logic. logging in steps could lead into wierd behavior
eval_strategy: 'epoch' # Evaluation strategy | Need to be Epoch for my logic. logging in steps could lead into wierd behavior
log_level: 'info' # Adjust the logs you want to see printed
seed: 42 # Seed for reproducibility
dataloader_drop_last: false # Drop last batch if it is smaller than the batch size
dataloader_num_workers: 1 # Number of workers for the dataloader. Higher than 1 seems to lead into performance issues
learning_rate: 0.00005 # Learning rate for the optimizer
metric_for_best_model : 'loss' # Metric for the best model. ['loss', 'accuracy'] for selecting the best model
train_file: '../../data/train_data/whitelab_hemo_data.csv' # Path to the training data
model_path: 'Rostlab/prot_bert_bfd' # Path to the model
model_save_path: '../test_BERT' # Path to save the model
plot_path: '../../plots' # Path to save the plots
ignore_leakage: false # Ignore leakage in the train dataset. Only do if you are sure what you are doing
mlm_probability: 0.15 # Probability for the masked language model to mask tokens
max_length: 36 # Maximum length of the input sequence
fast_debug_mode: false # Fast debug mode for testing the pipeline. [Developer Mode]
validation_data_size: 0.2 # Size of the validation dataset
test_data_size: 0.5 # Size of the test dataset
use_cpu: false # Use CPU for training
early_stopping_patience: 20 # Patience for the early stopping
early_stop_metric: 'eval_loss' # Metric for the early stopping
early_stop_mode: 'min' # Mode for the early stopping
early_stop_warm_up: 50 # Need to find a senseful value
lr_scheduler_type: 'reduce_lr_on_plateau' # Type of the learning rate scheduler
