training_arguments:
  binary:
    do_train: true
    do_eval: true
    do_predict: true
    output_dir: './results'
    num_train_epochs: 50
    per_device_train_batch_size: 128
    per_device_eval_batch_size: 128
    weight_decay: 0.01
    logging_dir: './logs'
    logging_strategy: 'epoch'
    evaluation_strategy: 'epoch'
    log_level: 'info'
    seed: 42
    dataloader_drop_last: false
    dataloader_num_workers: 1
    learning_rate: 0.00005
    lro_patience: 4
    lro_factor: 0.1
    lro_min_lr: 1e-7
    lro_mode: 'min'
    metric_for_best_model : 'loss'
  mlm:
    do_train: true
    do_eval: true
    do_predict: true
    output_dir: './results'
    num_train_epochs: 2000
    per_device_train_batch_size: 128
    per_device_eval_batch_size: 128
    weight_decay: 0.01
    logging_dir: './logs'
    logging_strategy: 'epoch'
    evaluation_strategy: 'epoch'
    log_level: 'info'
    seed: 42
    dataloader_drop_last: false
    dataloader_num_workers: 1
    learning_rate: 0.00005
    lro_patience: 10
    lro_factor: 0.1
    lro_min_lr: 1e-7
    lro_mode: 'min'
    metric_for_best_model : 'loss'
