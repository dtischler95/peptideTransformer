training_arguments:
  binary:
    do_train: true
    do_eval: true
    do_predict: true
    output_dir: './results'
    num_train_epochs: 50
    per_device_train_batch_size: 128
    per_device_eval_batch_size: 128
    warmup_steps: 500
    weight_decay: 0.01
    logging_dir: './logs'
    logging_strategy: 'epoch'
    evaluation_strategy: 'epoch'
    log_level: 'info'
    seed: 42
    dataloader_drop_last: false
    dataloader_num_workers: 1
    optim: 'adamw_torch'
    lr_scheduler_type: 'linear'
    learning_rate: 0.00005
  binary_reducer:
    patience: 4
    factor: 0.1
    min_lr: 1e-7
  mlm:
    do_train: true
    do_eval: true
    do_predict: true
    output_dir: './results'
    num_train_epochs: 2000
    per_device_train_batch_size: 128
    per_device_eval_batch_size: 128
    warmup_steps: 1000
    weight_decay: 0.01
    logging_dir: './logs'
    logging_strategy: 'epoch'
    evaluation_strategy: 'epoch'
    log_level: 'info'
    seed: 42
    dataloader_drop_last: false
    dataloader_num_workers: 1
    optim: 'adamw_torch'
    lr_scheduler_type: 'linear'
    learning_rate: 0.00005
  mlm_reducer:
    patience: 4
    factor: 0.1
    min_lr: 1e-7
