name: tests

on:
  push:
    branches: [master, add-esm-backbone]
  pull_request:
    branches: [master, add-esm-backbone]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Guarantee the hermetic tests never reach out to the HF hub. The opt-in
      # ESM integration test (RUN_INTEGRATION) is not set here, so it stays skipped.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU torch
        run: pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
